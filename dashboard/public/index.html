<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CryptoResearch</title>
  <meta name="description" content="Private, local crypto watchlist, research and portfolio dashboard.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/position.css">
  <link rel="stylesheet" href="/chart.css">
  <link rel="stylesheet" href="/dex.css">
  <link rel="stylesheet" href="/brief.css">
  <link rel="stylesheet" href="/explorer.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="demo-banner" class="demo-banner hidden">Fictional demo data: not real research, prices or holdings</div>
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/watchlist"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="10.5" fill="none" stroke="currentColor" stroke-width="2" opacity="0.4"/><circle cx="16" cy="16" r="3.8" fill="currentColor"/><circle cx="16" cy="5.5" r="3.1" fill="currentColor"/><circle cx="6.9" cy="21.3" r="3.1" fill="currentColor"/><circle cx="25.1" cy="21.3" r="3.1" fill="currentColor"/></svg>CryptoResearch <span class="tag hidden" id="ws-kind"></span></a>
      <button type="button" class="menu-btn quiet" id="menu-btn" aria-expanded="false" aria-controls="nav">Menu</button>
      <nav class="mainnav" id="nav" aria-label="Main"></nav>
      <span class="spacer"></span>
      <span class="status-dot" id="live" title="Connection to the local dashboard server"><span class="dot" aria-hidden="true"></span><span class="status-text" id="live-text">Connecting</span></span>
      <span class="topbar-end" id="topbar-end"></span>
    </div>
  </header>
  <!-- The watchlist's status strip: a full-width band under the bar (views/watchlist.js fills it; other pages leave it empty). -->
  <div class="strip-band" id="strip-root"></div>
  <div class="layout" id="layout">
    <main id="main" tabindex="-1"><div class="boot" role="status"><span class="sr-only">Loading your workspace…</span><span class="skel title"></span><span class="skel w80"></span><span class="skel w60"></span><span class="skel"></span><span class="skel w80"></span><span class="skel w40"></span></div></main>
    <div id="panel-root"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="sr-live" aria-live="polite"></div>
</body>
</html>
