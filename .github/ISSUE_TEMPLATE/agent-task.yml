name: Agent task
description: One task for the agent lane. It arrives as a draft; nothing is built until Eric adds the agent:ready label himself.
labels: ["agent:draft"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is a draft (**agent:draft**) until Eric adds the **agent:ready** label. The agent lane builds it only then, and only the version of the issue he labeled: an edit after that needs the label again. The build opens a pull request that Eric merges himself. The outcome, the acceptance checks and the negative cases are the task; the files and tests are optional hints that narrow the build (empty, the template's own directories are the scope). Keep secrets, records and addresses out of it.
  - type: dropdown
    id: lane_template
    attributes:
      label: Template
      description: What the lane may change (.github/agent-policy.json and dashboard/engineering/policy.js).
      options:
        - eng-backend@1
        - eng-docs@1
        - eng-app@4
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true when the task is done, in plain words.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: One check per line that a test can show.
    validations:
      required: true
  - type: textarea
    id: negative
    attributes:
      label: Negative cases
      description: What must be refused or handled, one per line. Each needs a test that fails without the change.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Regression tests
      description: Optional. The test files under dashboard/tests/ that show the outcome (added or changed by the build). Empty, the build names them; every build still adds or changes a test.
    validations:
      required: false
  - type: textarea
    id: paths
    attributes:
      label: Files to change
      description: Optional. One repository path per line to narrow the build. Empty, the build may change any file inside the template's own directories, never a protected or forbidden one.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else the builder should know.
