# The unattended deciding review of an engineering candidate (Eric,
# 2026-10-26, audits/2026-10-26-backend-autonomy). Off until Eric sets the
# repository variable CANDIDATE_REVIEW_ENABLED to true.
#
# When a `test` run passes on claude/candidate-eng-<n> (its push or its pull
# request; the desk waits until every check run on the head has finished, so
# the last one to finish reviews), or a pull request from such a branch opens
# or is updated, main's own dashboard/engineering/reviewer.js:
#
#   - reads the branch as data, never runs it (main is checked out; the
#     candidate is only fetched, diffed and read);
#   - asks the desk for the candidate's review packet with the reviewer token
#     (CR_ENG_REVIEWER_TOKEN, the same value Eric sets on the desk);
#   - checks the merge base, the exact diff and its files, the commit authors
#     and trailers (no builder may be the reviewer's own kind of assistant),
#     and that a changed test requires a changed module, before any paid call;
#   - asks ChatGPT through the OpenAI API (OPENAI_API_KEY, model
#     OPENAI_REVIEW_MODEL; no default model), once per head;
#   - saves the review on the desk, which checks the candidate, merge base,
#     diff, GitHub's check runs and Rule N4 again;
#   - opens the pull request for a pass when none is open, and comments the
#     result (codes, counts and paths; the findings' words stay on the desk).
#
# It never merges, approves, pushes or changes a branch: a pass makes the task
# ready, and Eric merges the pull request himself (the sovereign merge
# boundary; the desk never attests an unattended pass to backlog-pr). Uses
# GITHUB_TOKEN for the pull request and its comment only. Opening a pull
# request needs Settings > Actions > General > "Allow GitHub Actions to create
# and approve pull requests", as backlog-pr does.
name: candidate-review

on:
  workflow_run:
    workflows: [test]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions: {}

jobs:
  review:
    name: candidate review
    if: >-
      vars.CANDIDATE_REVIEW_ENABLED == 'true' && (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request') &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         startsWith(github.event.workflow_run.head_branch, 'claude/candidate-eng-')) ||
        (github.event_name == 'pull_request_target' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         startsWith(github.event.pull_request.head.ref, 'claude/candidate-eng-')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: candidate-review-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
      cancel-in-progress: false
    steps:
      # main's code only; the candidate is fetched as data by reviewer.js.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Review the candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DESK_URL: ${{ vars.DESK_URL || 'https://cryptoresearch.onrender.com' }}
          CR_ENG_REVIEWER_TOKEN: ${{ secrets.CR_ENG_REVIEWER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
        run: node dashboard/engineering/reviewer.js
