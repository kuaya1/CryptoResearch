# Proposes an engineering task's bound entry for main's backlog (Connected
# Engineering v1, 2026-10-25; audits/2026-10-25-connected-engineering). Since
# 2026-10-26 it never writes main: Eric alone merges into main
# (audits/2026-10-26-engineering-simplification).
#
# The builder pushes claude/admission-<task> holding one commit that adds the
# entry the desk bound for that task. This job runs main's own script, never
# the branch's code (dashboard/scripts/backlog-promote.js admission --propose):
# it reads the branch as data, asks the desk's public admission record
# (DESK_URL/engineering/admissions/<task>) whether that exact entry, number and
# version may join, re-applies the entry onto main as it is now (never a
# merge), replaces the builder's commit on the same branch by compare-and-swap
# and opens the pull request Eric merges. A paused or unreadable desk, a
# revoked delegation, a number already on main or given in the issue queue
# (the agent ledger), or any other change in the branch is a refusal with the
# reason.
#
# It proposes a backlog line only; nothing is built or merged by it. Uses only
# GITHUB_TOKEN; its push starts no workflow, and GitHub holds the checks of a
# pull request it opens until Eric approves them on the pull request.
name: engineering-admission

on:
  push:
    branches: ['claude/admission-eng-*']

permissions: {}

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # Everything from the event goes through env, never into the script text.
      - name: Propose the bound entry
        id: admit
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          DESK_URL: ${{ vars.DESK_URL || 'https://cryptoresearch.onrender.com' }}
        run: |
          cp dashboard/scripts/backlog-promote.js "$RUNNER_TEMP/backlog-promote.js"
          node "$RUNNER_TEMP/backlog-promote.js" admission --branch "$BRANCH" --head "$SHA" --propose true
      - name: Open the pull request Eric merges
        if: steps.admit.outputs.status == 'proposed'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          NUMBER: ${{ steps.admit.outputs.number }}
        run: |
          owner=${REPO%%/*}
          open=$(gh api "repos/$REPO/pulls?state=open&base=main&head=$owner:$BRANCH" --jq '.[0].number // empty')
          if [ -z "$open" ]; then
            gh api -X POST "repos/$REPO/pulls" -f title="Admission: backlog item $NUMBER (${BRANCH#claude/admission-})" -f head="$BRANCH" -f base=main -f body="The desk's bound backlog entry for ${BRANCH#claude/admission-}, re-applied onto main by engineering-admission. Eric merges it; no workflow writes main." --jq .html_url >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pull request #$open already carries $BRANCH." >> "$GITHUB_STEP_SUMMARY"
          fi
