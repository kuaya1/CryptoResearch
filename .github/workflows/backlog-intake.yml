# Voice intake (blueprint W3.4, DESK_STATE item 17): when Eric labels an issue
# `ready`, a PR adds the issue, quoted and linked, as the next numbered item in
# DESK_STATE.md. It builds nothing and never merges: Eric merges this PR like
# any other. Only the label `ready` set by `kuaya1` counts; that is the
# account's action, not proof a person set it, and the PR says so. The issue
# text is data, passed through env and files, never into a script.
#
# A retry converges (review A09, 2026-10-25; dashboard/scripts/backlog-intake.js):
# intake is done when its PR is known, not when its branch exists. A branch
# whose PR call failed gets its PR; an open, merged or closed PR is said as it
# is; numbers waiting on other open intake branches are not reused. Intakes run
# one at a time. Needs Settings > Actions > General > "Allow GitHub Actions to
# create and approve pull requests".
name: backlog-intake

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: backlog-intake
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      github.event.label.name == 'ready' &&
      github.event.sender.login == 'kuaya1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add the issue as the next item and open the PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          URL: ${{ github.event.issue.html_url }}
          SENDER: ${{ github.event.sender.login }}
          LABELED_AT: ${{ github.event.issue.updated_at }}
        run: |
          cp dashboard/scripts/backlog-intake.js "$RUNNER_TEMP/backlog-intake.js"
          node "$RUNNER_TEMP/backlog-intake.js"
