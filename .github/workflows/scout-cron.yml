# Grok Scout's daily sweep (Eric, 2026-10-26; audits/2026-10-26-grok-scout).
# dashboard/scripts/grok-cron.js asks xAI (a paid call) once per lane and
# sends one brief to the online desk. Scheduled runs happen only while the
# repository variable SCOUT_ENABLED is 'true', which Eric sets; Run workflow
# (workflow_dispatch) is his own run. The secrets are his, entered in GitHub:
# XAI_API_KEY, DESK_INGEST_KEY and DESK_INGEST_URL. The script prints counts
# only, as this repository and its logs are public. The leads call (a fifth
# paid call, cr-scout-leads-prompt@1) runs only while the repository variable
# SCOUT_LEADS is 'true', which Eric sets.
name: scout-cron

on:
  schedule:
    # 11:30 UTC: 06:30 in New York in winter, 07:30 in summer. GitHub can
    # start a scheduled run late when it is busy.
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scout-cron
  cancel-in-progress: false

jobs:
  sweep:
    if: github.event_name == 'workflow_dispatch' || vars.SCOUT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Sweep
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DESK_INGEST_KEY: ${{ secrets.DESK_INGEST_KEY }}
          DESK_INGEST_URL: ${{ secrets.DESK_INGEST_URL }}
          SCOUT_LEADS: ${{ vars.SCOUT_LEADS }}
        run: node dashboard/scripts/grok-cron.js
