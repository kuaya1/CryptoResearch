# Opens or updates the pull request for a backlog branch once its tests pass
# (blueprint W2.2, DESK_STATE item 11) and tests it composed onto main. It
# never merges: Eric merges every pull request himself (exclusive merge
# authority, 2026-10-26, audits/2026-10-26-engineering-simplification). The
# promote and deploy jobs that pushed a tested composition to main (zero-click
# merge, 2026-10-25) are removed; once the main-merge-authority ruleset is
# active, no workflow token can update main at all.
#
#   pr       main's checkout only: reads the branch as data, opens or updates
#            the PR, and checks the scope (dashboard/scripts/backlog-promote.js
#            scope). A protected path or an item not on main's backlog is said
#            in the summary; the PR stays open for Eric either way.
#   compose  merges the tested head onto main as it is now and runs the full
#            suite on that tree, with a read-only token and no secret. When
#            the branch already contains main, the tree is the head the push
#            run tested and the suite is not run twice. Its result is a
#            report for Eric's merge, never a merge.
#
# No concurrency group: GitHub would cancel all but one pending run, and every
# test run triggers this workflow. Uses only GITHUB_TOKEN. A pull request this
# token opens starts no checks by itself (GitHub holds its runs for approval);
# Eric approves them on the pull request.
name: backlog-pr

on:
  workflow_run:
    workflows: [test]
    types: [completed]

permissions: {}

jobs:
  pr:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/backlog-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: read
    outputs:
      go: ${{ steps.pr.outputs.go }}
      number: ${{ steps.pr.outputs.number }}
      base: ${{ steps.pr.outputs.base }}
      scope_ok: ${{ steps.scope.outputs.scope_ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the test counts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-summary
          path: ${{ runner.temp }}/counts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # Everything from the event goes through env, never into the script text.
      - name: Read the branch and open or update the pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          # Only the commit that was tested goes further; a newer push has its own run.
          tip=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null || true)
          if [ "$tip" != "$SHA" ]; then
            echo "The branch is at ${tip:-nothing}, not the tested ${SHA:0:7}; its own run handles it." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The repository is private: the fetch carries the job's token as a
          # header, never written to the git config.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          base=$(git rev-parse origin/main)
          commits=$(git log --format='- `%h` %s' "$base..$SHA")
          counts="No test counts were found for this run."
          if [ -f "$RUNNER_TEMP/counts/test-summary.md" ]; then counts=$(cat "$RUNNER_TEMP/counts/test-summary.md"); fi
          body=$(printf 'Backlog branch `%s`, tested at `%s` ([the run](%s)).\n\n%s\n\n%s\n\nOpened by the backlog-pr workflow. It merges only the tree that passed the suite on top of main, while main is unchanged, and only within the authorized scope; otherwise this PR waits for Eric.\n' "$BRANCH" "${SHA:0:7}" "$RUN_URL" "$commits" "$counts")
          owner=${REPO%%/*}
          number=$(gh api "repos/$REPO/pulls?state=open&base=main&head=$owner:$BRANCH" --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh api -X PATCH "repos/$REPO/pulls/$number" -f body="$body" --jq .html_url
          else
            number=$(gh api -X POST "repos/$REPO/pulls" -f title="Backlog: ${BRANCH#claude/backlog-}" -f head="$BRANCH" -f base=main -f body="$body" --jq .number)
          fi
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "### No pull request could be opened or found for $BRANCH" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          { echo "go=true"; echo "number=$number"; echo "base=$base"; } >> "$GITHUB_OUTPUT"
      # An engineering item (Connected Engineering v1) is also checked against
      # the desk's public attestation of this exact head (DESK_URL).
      - name: Check the scope Eric authorized
        id: scope
        if: steps.pr.outputs.go == 'true'
        shell: bash
        env:
          BASE: ${{ steps.pr.outputs.base }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          DESK_URL: ${{ vars.DESK_URL || 'https://cryptoresearch.onrender.com' }}
        run: node dashboard/scripts/backlog-promote.js scope --base "$BASE" --head "$SHA" --branch "$BRANCH"

  compose:
    needs: pr
    if: needs.pr.outputs.go == 'true' && needs.pr.outputs.scope_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      tree: ${{ steps.merge.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # The merge is made with main's own script, before any branch code runs.
      - name: Merge the tested head onto main
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.pr.outputs.base }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          NUMBER: ${{ needs.pr.outputs.number }}
        run: |
          # The repository is private: the fetch carries this job's read-only
          # token as a header, never written to the git config, and no later
          # step (where branch code runs) has it.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          cp dashboard/scripts/backlog-promote.js "$RUNNER_TEMP/backlog-promote.js"
          node "$RUNNER_TEMP/backlog-promote.js" compose --base "$BASE" --head "$SHA" --message "Merge pull request #$NUMBER from $GITHUB_REPOSITORY_OWNER/$BRANCH"
      - uses: actions/setup-node@v4
        if: steps.merge.outputs.contains_base != 'true'
        with:
          node-version: 24.21.0
      - name: Run the full suite on the composed tree
        if: steps.merge.outputs.contains_base != 'true'
        shell: bash
        run: node dashboard/cli.js test 2>&1 | tail -n 40
      # The guard test is protected and run here by name (review N1, N2), so a
      # branch that changes how the suite is run still meets it.
      - name: Run the protected guard test
        if: steps.merge.outputs.contains_base != 'true'
        shell: bash
        run: node --test dashboard/tests/engineering-guard.test.js 2>&1 | tail -n 40
      # A gate for a branch that changes the committed bundle (review N3): the
      # bundle must be exactly what its sources build. Reported otherwise.
      - name: Clean build of the browser app
        shell: bash
        env:
          BASE: ${{ needs.pr.outputs.base }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          bundle=$(git diff --name-only "$BASE...$SHA" -- dashboard/public/app | head -n 1)
          if npm --prefix dashboard/web ci --no-audit --no-fund >/dev/null && npm --prefix dashboard/web run build >/dev/null && git diff --quiet -- dashboard/public/app && [ -z "$(git status --porcelain -- dashboard/public/app)" ]; then
            echo "Clean build: matches the committed bundle." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$bundle" ]; then
            echo "### Clean build: does NOT match the committed bundle (or failed), and this branch changes the bundle. Not promoted." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "Clean build: does NOT match the committed bundle (or failed). This branch does not change the bundle, so it is reported, not a gate; look at it." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Eric merges
        shell: bash
        run: echo "Composed and tested. Nothing was merged; Eric merges the pull request himself." >> "$GITHUB_STEP_SUMMARY"
