# CI for the desk (blueprint W2.1, DESK_STATE item 10): the full suite on
# every pull request to main and on main after each merge (main as it
# landed). It is the one check the main-merge-requirements ruleset requires
# (audits/2026-10-27-de-escalation). The tests use fictional workspaces only;
# no secret is read.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Run the full suite
        shell: bash
        run: node dashboard/cli.js test 2>&1 | tee test-output.txt
      # The counts go to the job summary and to an artifact. Node prints them
      # as "ℹ tests n" or "# tests n".
      - name: Counts
        if: always()
        shell: bash
        run: |
          {
            echo "### node dashboard/cli.js test"
            echo
            grep -E '^(ℹ|#) (tests|suites|pass|fail|cancelled|skipped|todo|duration_ms) ' test-output.txt | sed -E 's/^(ℹ|#) /- /' || echo "No counts in the output."
          } | tee test-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-summary
          path: test-summary.md
          retention-days: 14
