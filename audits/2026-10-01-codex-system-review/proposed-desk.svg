<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Proposed CryptoResearch daily desk layout</title>
  <desc id="desc">Fictional design proposal with valuation coverage, separate holdings and watchlist, changes since review and one review queue.</desc>
  <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#24364b}.small{font-size:14px;fill:#52647a}.body{font-size:16px}.label{font-size:13px;font-weight:600;fill:#52647a}.heading{font-size:21px;font-weight:600}.rule{stroke:#d7dfe8}.card{fill:#fff;stroke:#d7dfe8}.blue{fill:#164f91}.amber{fill:#805000}</style>
  <rect width="1200" height="850" fill="#f4f6f9"/>
  <rect width="190" height="850" fill="#fff"/>
  <path d="M190 0v850" class="rule"/>
  <text x="24" y="42" font-size="21" font-weight="600">CryptoResearch</text>
  <text x="24" y="68" class="small">Proposed daily desk</text>
  <rect x="14" y="98" width="162" height="40" rx="7" fill="#e7effa"/>
  <text x="28" y="124" class="body blue">Desk</text>
  <text x="28" y="174" class="body">Holdings</text><text x="28" y="224" class="body">Research</text><text x="28" y="274" class="body">Evidence</text><text x="28" y="324" class="body">Reviews</text><text x="28" y="374" class="body">Imports / settings</text>
  <text x="24" y="778" class="small">Design mockup only</text><text x="24" y="800" class="small">All amounts fictional</text>
  <text x="220" y="47" font-size="28" font-weight="600">Your research desk</text>
  <text x="220" y="73" class="small">Owned, watched and changed — with the evidence and next action in view</text>
  <rect x="964" y="29" width="204" height="38" rx="6" fill="#164f91"/><text x="990" y="54" font-size="15" style="fill:#fff">Import report / add project</text>
  <rect x="220" y="97" width="948" height="118" rx="8" class="card"/>
  <text x="242" y="126" class="label">PRICED SUBTOTAL</text><text x="242" y="166" font-size="32" font-weight="600">$6,200</text><text x="242" y="192" class="small">3 of 4 assets priced · 1 awaiting a quote</text>
  <path d="M639 115v82" class="rule"/>
  <text x="663" y="126" class="label">COVERAGE / FRESHNESS</text><text x="663" y="157" class="body amber">2 stale quotes · retained last valid values</text><text x="663" y="184" class="small">Latest successful fetch 2 hours ago · inspect feed</text>
  <rect x="220" y="237" width="558" height="227" rx="8" class="card"/>
  <text x="242" y="270" class="heading">Holdings</text><text x="691" y="269" class="small blue">View ledger</text>
  <text x="242" y="307" class="label">ASSET / QUANTITY</text><text x="475" y="307" class="label">BASIS</text><text x="637" y="307" class="label">VALUE</text><path d="M242 321h514" class="rule"/>
  <text x="242" y="350" class="body">BTC · 0.04 BTC</text><text x="475" y="350" class="body">Known</text><text x="637" y="350" class="body">$2,600</text>
  <text x="242" y="388" class="body">Example token · 800 units</text><text x="475" y="388" class="body">Partial</text><text x="637" y="388" class="body">$3,600*</text>
  <text x="242" y="429" class="small">* Stale price. Unknown basis excluded from known gain.</text>
  <rect x="798" y="237" width="370" height="227" rx="8" class="card"/>
  <text x="820" y="270" class="heading">Watchlist</text><text x="820" y="305" class="small">Research entries · no implied holdings</text><path d="M820 321h326" class="rule"/>
  <text x="820" y="350" class="body">Example network</text><text x="820" y="375" class="small">Thesis not selected · usage evidence due</text>
  <text x="820" y="413" class="body">Example protocol</text><text x="820" y="438" class="small">Selected thesis · next review October 8</text>
  <rect x="220" y="486" width="948" height="139" rx="8" class="card"/>
  <text x="242" y="520" class="heading">Changes since your last review</text><text x="965" y="518" class="small blue">Review history</text>
  <text x="242" y="552" class="body">Protocol revenue: prior → current observation</text><text x="755" y="552" class="small">Definition + period + source</text>
  <text x="242" y="582" class="body">New analyst report proposes a thesis revision</text><text x="755" y="582" class="small">Original retained · owner review needed</text>
  <rect x="220" y="647" width="948" height="174" rx="8" class="card"/>
  <text x="242" y="681" class="heading">Review queue</text><text x="945" y="680" class="small">One issue, one next action</text>
