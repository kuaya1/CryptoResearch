  <text x="242" y="728" class="body amber">Failed import</text><text x="431" y="728" class="body">Draft retained; report too short</text><text x="1012" y="728" class="body blue">Fix draft →</text>
  <text x="242" y="762" class="body amber">Claim unresolved</text><text x="431" y="762" class="body">Different definitions; no contradiction asserted</text><text x="1012" y="762" class="body blue">Evidence →</text>
  <text x="242" y="796" class="body">Review due</text><text x="431" y="796" class="body">Check selected thesis and its conditions</text><text x="1012" y="796" class="body blue">Review →</text>
</svg>
